{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl mt-8">
    <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white">Citizen & Graduate Portal</h2>
        <p class="text-xs text-slate-400 mt-1">Access youth employment matching, GBV emergency dispatch, and El Niño agricultural aid.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="graduate@apex.co.za" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">Login to Gadget Hub</button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400 flex justify-between items-center">
        <a href="{{ url_for('register') }}" class="text-emerald-400 hover:underline font-medium">Create Citizen Account</a>
        <a href="{{ url_for('admin_login') }}" class="text-slate-500 hover:underline">Admin Portal →</a>
    </div>
</div>
{% endblock %}
