{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl mt-8">
    <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white">Admin Site Registration</h2>
        <p class="text-xs text-slate-400 mt-1">Requires official government security access code.</p>
    </div>

    <form method="POST" action="{{ url_for('admin_register') }}" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Full Name</label>
            <input type="text" name="full_name" required placeholder="Col. Masetla" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="admin@gov.za" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Secret Access Code</label>
            <input type="password" name="secret_code" required placeholder="APEX-SA-2026" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition shadow-lg shadow-blue-600/20">Create Admin Account</button>
    </form>
</div>
{% endblock %}
