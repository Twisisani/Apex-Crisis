{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl mt-8">
    <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white">Admin Command Site Login</h2>
        <p class="text-xs text-slate-400 mt-1">Authorized personnel only. Oversee national crisis response infrastructure.</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Admin Email</label>
            <input type="email" name="email" required value="admin@apex.gov.za" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required value="Admin@2026" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition shadow-lg shadow-blue-600/20">Authenticate Command Center</button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400 flex justify-between items-center">
        <a href="{{ url_for('admin_register') }}" class="text-blue-400 hover:underline font-medium">Register Admin Account</a>
        <a href="{{ url_for('login') }}" class="text-slate-500 hover:underline">← Citizen Portal</a>
    </div>
</div>
{% endblock %}
