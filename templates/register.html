{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl mt-8">
    <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white">Citizen Registration</h2>
        <p class="text-xs text-slate-400 mt-1">Join the APEX national empowerment and crisis network.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Full Name</label>
            <input type="text" name="full_name" required placeholder="Thandiwe Khosa" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="thandiwe@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required placeholder="********" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">Register Account</button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
        Already have an account? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:underline font-medium">Login here</a>
    </div>
</div>
{% endblock %}
